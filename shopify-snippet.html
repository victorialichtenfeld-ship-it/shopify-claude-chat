<!-- PASTE THIS INTO YOUR SHOPIFY THEME.LIQUID JUST BEFORE </body> -->
<!-- REPLACE "YOUR_VERCEL_URL" ON LINE 7 WITH YOUR ACTUAL VERCEL URL -->
<!-- REPLACE STORE_NAME ON LINE 8 IF NEEDED -->
<!-- REPLACE THE PHONE AND EMAIL ON LINES 9-10 WITH YOUR SPA'S REAL CONTACT DETAILS -->
<script>
(function () {
  var API_URL = "https://YOUR_VERCEL_URL/api/chat";
  var STORE_NAME = "Velora Med Spa";
  var PHONE = "(555) 555-5555";
  var EMAIL = "hello@yourdomain.com";
  var ACCENT_COLOR = "#2c6ecb";
  var messages = [];
  var isOpen = false;

  var styles = "\n    #claude-chat-btn {\n      position: fixed; bottom: 24px; right: 24px; z-index: 9999;\n      width: 56px; height: 56px; border-radius: 50%; border: none;\n      background: " + ACCENT_COLOR + "; color: white; font-size: 24px;\n      cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.2);\n      display: flex; align-items: center; justify-content: center;\n      transition: transform 0.2s;\n    }\n    #claude-chat-btn:hover { transform: scale(1.1); }\n    #claude-chat-box {\n      position: fixed; bottom: 92px; right: 24px; z-index: 9998;\n      width: 340px; height: 480px; border-radius: 16px;\n      box-shadow: 0 8px 32px rgba(0,0,0,0.18); display: none;\n      flex-direction: column; overflow: hidden; font-family: system-ui, sans-serif;\n      background: #fff;\n    }\n    #claude-chat-box.open { display: flex; }\n    #claude-chat-header {\n      background: " + ACCENT_COLOR + "; color: white; padding: 14px 16px;\n      font-weight: 600; font-size: 15px;\n    }\n    #claude-chat-header small { font-size: 11px; opacity: 0.8; font-weight: 400; display: block; }\n    #claude-chat-contact { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #eee; }\n    #claude-chat-contact a {\n      flex: 1; text-align: center; text-decoration: none; font-size: 13px; font-weight: 600;\n      padding: 8px 0; border-radius: 20px; border: 1px solid " + ACCENT_COLOR + "; color: " + ACCENT_COLOR + ";\n    }\n    #claude-chat-contact a.primary { background: " + ACCENT_COLOR + "; color: white; }\n    #claude-chat-messages {\n      flex: 1; overflow-y: auto; padding: 16px;\n      display: flex; flex-direction: column; gap: 10px;\n    }\n    .claude-msg {\n      max-width: 82%; padding: 10px 14px; border-radius: 16px;\n      font-size: 14px; line-height: 1.5; word-wrap: break-word;\n    }\n    .claude-msg.bot { background: #f0f2f5; color: #111; align-self: flex-start; border-bottom-left-radius: 4px; }\n    .claude-msg.user { background: " + ACCENT_COLOR + "; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }\n    .claude-msg.typing { opacity: 0.6; font-style: italic; }\n    #claude-chat-input-row { display: flex; padding: 10px 12px; border-top: 1px solid #eee; gap: 8px; }\n    #claude-chat-input {\n      flex: 1; border: 1px solid #ddd; border-radius: 20px;\n      padding: 8px 14px; font-size: 14px; outline: none;\n      font-family: inherit; resize: none;\n    }\n    #claude-chat-input:focus { border-color: " + ACCENT_COLOR + "; }\n    #claude-chat-send {\n      background: " + ACCENT_COLOR + "; color: white; border: none;\n      border-radius: 50%; width: 36px; height: 36px; cursor: pointer;\n      font-size: 16px; display: flex; align-items: center; justify-content: center;\n      flex-shrink: 0; align-self: flex-end;\n    }\n    #claude-chat-send:disabled { opacity: 0.5; cursor: default; }\n  ";

  function init() {
    var styleEl = document.createElement("style");
    styleEl.textContent = styles;
    document.head.appendChild(styleEl);

    var btn = document.createElement("button");
    btn.id = "claude-chat-btn";
    btn.innerHTML = "&#128172;";
    btn.title = "Chat with us";
    btn.onclick = toggleChat;

    var box = document.createElement("div");
    box.id = "claude-chat-box";
    box.innerHTML =
      '<div id="claude-chat-header">' + STORE_NAME + '<small>Ask us anything or book a consultation</small></div>' +
      '<div id="claude-chat-contact">' +
      '<a class="primary" href="tel:' + PHONE.replace(/[^0-9+]/g, "") + '">&#128222; Call ' + PHONE + '</a>' +
      '<a href="mailto:' + EMAIL + '?subject=' + encodeURIComponent("Consultation request") + '">&#9993; Email us</a>' +
      '</div>' +
      '<div id="claude-chat-messages"></div>' +
      '<div id="claude-chat-input-row">' +
      '<textarea id="claude-chat-input" rows="1" placeholder="Ask me anything..."></textarea>' +
      '<button id="claude-chat-send">&#10148;</button>' +
      "</div>";

    document.body.appendChild(btn);
    document.body.appendChild(box);

    document.getElementById("claude-chat-send").onclick = sendMessage;
    document.getElementById("claude-chat-input").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    addBotMessage("Hi! Welcome to " + STORE_NAME + ". Curious about a treatment? Ask me anything, or call " + PHONE + " / email " + EMAIL + " to book your consultation.");
  }

  function toggleChat() {
    isOpen = !isOpen;
    document.getElementById("claude-chat-box").classList.toggle("open", isOpen);
    document.getElementById("claude-chat-btn").innerHTML = isOpen ? "&#10005;" : "&#128172;";
    if (isOpen) document.getElementById("claude-chat-input").focus();
  }

  function addBotMessage(text) {
    var el = document.createElement("div");
    el.className = "claude-msg bot";
    el.textContent = text;
    document.getElementById("claude-chat-messages").appendChild(el);
    scrollToBottom();
    return el;
  }

  function scrollToBottom() {
    var msgs = document.getElementById("claude-chat-messages");
    msgs.scrollTop = msgs.scrollHeight;
  }

  function sendMessage() {
    var input = document.getElementById("claude-chat-input");
    var send = document.getElementById("claude-chat-send");
    var text = input.value.trim();
    if (!text) return;

    input.value = "";
    send.disabled = true;

    var userEl = document.createElement("div");
    userEl.className = "claude-msg user";
    userEl.textContent = text;
    document.getElementById("claude-chat-messages").appendChild(userEl);
    scrollToBottom();

    messages.push({ role: "user", content: text });

    var typingEl = document.createElement("div");
    typingEl.className = "claude-msg bot typing";
    typingEl.textContent = "Thinking...";
    document.getElementById("claude-chat-messages").appendChild(typingEl);
    scrollToBottom();

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: messages.slice(-10), storeName: STORE_NAME, phone: PHONE, email: EMAIL }),
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var reply = data.reply || "Sorry, I couldn't get a response. Please try again.";
        typingEl.remove();
        messages.push({ role: "assistant", content: reply });
        addBotMessage(reply);
        send.disabled = false;
        input.focus();
      })
      .catch(function () {
        typingEl.remove();
        addBotMessage("Sorry, something went wrong. Please try again.");
        send.disabled = false;
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
<!-- END CLAUDE CHAT WIDGET -->
